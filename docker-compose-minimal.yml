# =============================================================================
# Dashboard deployment (Phase B) — webapp container only.
#
# This file owns ONLY the dashboard's read-time concerns: the Next.js
# webapp container that browsers connect to. The native FastAPI backend,
# PostgreSQL, and Redis run as host processes (see scripts/run-native.sh
# and scripts/setup-native-mac.sh).
#
# What is intentionally NOT here:
#   nlp-classifiers   The NLP classifier OCI is a write-time asset of the
#                     sibling AI pipeline (see ../AI_physician_patient_communication/
#                     and scripts/run-pipeline-standalone.py). Bundling it
#                     here used to couple two unrelated lifecycles —
#                     teammates who only wanted to view dashboard pages
#                     were forced to also have a working NLP image. The
#                     pipeline command now manages that container's
#                     lifecycle itself; the dashboard never touches it.
#
# Usage:
#   docker compose -f docker-compose-minimal.yml up -d
#   docker compose -f docker-compose-minimal.yml logs -f webapp
#   docker compose -f docker-compose-minimal.yml down
#
# Reference: README.md "Quick Start — Native Deployment" (Phase A vs Phase B)
# =============================================================================

services:

  # ── Frontend webapp (talks to native backend via host.docker.internal) ───
  webapp:
    build:
      context: app/Webapp
      dockerfile: Dockerfile
    container_name: prostatecancer-webapp-native
    env_file:
      - app/Webapp/.env.native       # NEXT_PUBLIC_API_URL=http://host.docker.internal:8000
    environment:
      NODE_ENV: production
      # Server-only env vars (host.docker.internal lets the container reach
      # the native uvicorn backend on the Mac/Linux host).
      BACKEND_URL: http://host.docker.internal:8000
      API_KEY: ${API_KEY}
    extra_hosts:
      # Linux: docker doesn't auto-resolve host.docker.internal — declare it.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"        # webapp directly on 3001 (no nginx in native mode)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
