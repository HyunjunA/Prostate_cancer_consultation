version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:13
    container_name: prostatecancer-postgres
    environment:
      POSTGRES_USER: sarscov_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: sarscov_db
      # (Optional) Strengthen authentication policy during initialization
      # POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5433:5432" # local -> container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarscov_user -d sarscov_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (cache, rate-limit, queue)
  redis:
    image: redis:7
    container_name: prostatecancer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379" # expose for local testing; remove in prod if not needed
    volumes:
      - redis_data:/data
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI Backend — PRODUCTION (Gunicorn + UvicornWorker)
  backend:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prostatecancer-backend
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://sarscov_user:secure_password_123@postgres:5432/sarscov_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sarscov_db
      DB_USER: sarscov_user
      DB_PASSWORD: secure_password_123

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "false"

      # Security Configuration
      SECRET_KEY: your-super-secret-key-change-this-in-production
      JWT_SECRET: change_me
      JWT_ALG: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # CORS Configuration
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]'

      # Upload/Logging/Pagination
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: '["csv", "xlsx"]'
      LOG_LEVEL: INFO
      LOG_FILE: logs/app.log
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 1000

      # Redis / cache & rate-limit
      REDIS_URL: redis://redis:6379/0

      # Gunicorn tuning
      WORKERS: 3
      THREADS: 2
      TIMEOUT: 120
      KEEPALIVE: 5

      # First-run init (0=skip, 1=run wait_for_db.py && init_db.py)
      RUN_DB_INIT: "0"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./Processed_Data_DB.csv:/app/Processed_Data_DB.csv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [prostatecancer-network]
    restart: unless-stopped

  # FastAPI Backend — DEVELOPMENT (Uvicorn --reload)
  backend-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prostatecancer-backend-dev
    environment:
      DATABASE_URL: postgresql://sarscov_user:secure_password_123@postgres:5432/sarscov_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sarscov_db
      DB_USER: sarscov_user
      DB_PASSWORD: secure_password_123

      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"

      SECRET_KEY: your-super-secret-key-change-this-in-production
      JWT_SECRET: change_me
      JWT_ALG: HS256
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]'

      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: '["csv", "xlsx"]'
      LOG_LEVEL: DEBUG
      LOG_FILE: logs/app.log
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 1000

      REDIS_URL: redis://redis:6379/0
      RUN_DB_INIT: "1" # dev 편의상 처음에만 1로 두고, 이후 0으로 변경 권장
    command: >
      sh -c "[ \"$RUN_DB_INIT\" = \"1\" ] && (python wait_for_db.py && python init_db.py);
      exec uvicorn main:app --host 0.0.0.0 --port 8000
      --reload --proxy-headers --forwarded-allow-ips='*' --log-level debug"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app:delegated
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./Processed_Data_DB.csv:/app/Processed_Data_DB.csv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [prostatecancer-network]
    restart: unless-stopped

  # PgAdmin Service (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: prostatecancer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sarscov.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks: [prostatecancer-network]
    restart: unless-stopped

# Named volumes for persistent data storage
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

# Custom bridge network for inter-service communication
networks:
  prostatecancer-network:
    driver: bridge
