version: "3.8"

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:13
    container_name: prostatecancer-postgres
    environment:
      POSTGRES_USER: sarscov_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: sarscov_db
      # (Optional) Strengthen authentication policy during initialization
      # POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5433:5432" # local -> container
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount existing database_schema.sql as initialization script (read-only)
      - ./database_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - prostatecancer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarscov_user -d sarscov_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (cache, rate-limit, queue)
  redis:
    image: redis:7
    container_name: prostatecancer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379" # expose for local testing; remove in prod if not needed
    volumes:
      - redis_data:/data
    networks:
      - prostatecancer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # FastAPI Backend Application Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prostatecancer-backend
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://sarscov_user:secure_password_123@postgres:5432/sarscov_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sarscov_db
      DB_USER: sarscov_user
      DB_PASSWORD: secure_password_123

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"

      # Security Configuration
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # CORS Configuration
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]'

      # Upload Configuration
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: '["csv", "xlsx"]'

      # Logging Configuration
      LOG_LEVEL: INFO
      LOG_FILE: logs/app.log

      # Pagination Configuration
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 1000

      # Redis / cache & rate-limit
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./Processed_Data_DB.csv:/app/Processed_Data_DB.csv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prostatecancer-network
    restart: unless-stopped

  # PgAdmin Service (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: prostatecancer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sarscov.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - prostatecancer-network
    restart: unless-stopped

# Named volumes for persistent data storage
volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

# Custom bridge network for inter-service communication
networks:
  prostatecancer-network:
    driver: bridge
