version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:13
    container_name: prostatecancer-postgres
    environment:
      POSTGRES_USER: sarscov_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: sarscov_db
      # (선택) 초기화 시 인증 정책 강화
      # POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    # 로컬에서 접속해야 하면 유지, 필요 없으면 ports 블록 제거 가능
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 존재하는 파일(database_schema.sql)을 초기화 스크립트로 마운트
      - ./database_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks:
      - prostatecancer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarscov_user -d sarscov_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prostatecancer-backend
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://sarscov_user:secure_password_123@postgres:5432/sarscov_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sarscov_db
      DB_USER: sarscov_user
      DB_PASSWORD: secure_password_123

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"

      # Security Configuration
      SECRET_KEY: your-super-secret-key-change-this-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # CORS Configuration
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost:8080"]'

      # Upload Configuration
      MAX_FILE_SIZE: 10485760
      ALLOWED_FILE_TYPES: '["csv", "xlsx"]'

      # Logging Configuration
      LOG_LEVEL: INFO
      LOG_FILE: logs/app.log

      # Pagination Configuration
      DEFAULT_PAGE_SIZE: 50
      MAX_PAGE_SIZE: 1000

    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./Processed_Data_DB.csv:/app/Processed_Data_DB.csv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prostatecancer-network
    restart: unless-stopped

  # Next.js Frontend (Webapp)
  frontend:
    build:
      context: ../Webapp # compose 파일이 backend/에 있으므로 상대경로
      dockerfile: Dockerfile
      # target: production         # (선택) 멀티스테이지 타깃 지정 가능
    container_name: prostatecancer-frontend
    environment:
      NODE_ENV: production
      # 프론트에서 백엔드를 호출할 때 내부 네트워크 호스트명 사용
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - prostatecancer-network
    restart: unless-stopped
    # (선택) 헬스체크를 쓰려면 Webapp Dockerfile에 wget 추가 필요: `apk add --no-cache wget`
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3

  # PgAdmin (Optional - Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: prostatecancer-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sarscov.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - prostatecancer-network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  prostatecancer-network:
    driver: bridge
