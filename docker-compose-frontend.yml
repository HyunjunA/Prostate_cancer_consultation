# =============================================================================
# Dashboard deployment (Phase B) — webapp container only.
#
# This file owns ONLY the dashboard's read-time concerns: the Next.js
# webapp container that browsers connect to. The native FastAPI backend,
# PostgreSQL, and Redis run as host processes (see scripts/run-frontend-backend.sh
# and scripts/setup-native-mac.sh).
#
# What is intentionally NOT here:
#   nlp-classifiers   The NLP classifier OCI is a write-time asset of the
#                     sibling AI/NLP pipeline. Its container lifecycle is
#                     managed by the AI repo's Phase A pipeline entry
#                     point, which brings the container up itself via
#                     utils/nlp_container.ensure_running():
#                       ../AI_physician_patient_communication/
#                         main_complete_pipeline_db.py
#                       ../AI_physician_patient_communication/
#                         docker-compose-ai-nlp-pipeline.yml
#                     Bundling NLP here used to couple two unrelated
#                     lifecycles — teammates who only wanted to view
#                     dashboard pages were forced to also have a working
#                     NLP image. The dashboard now never touches that
#                     container.
#
# Usage:
#   docker compose -f docker-compose-frontend.yml up -d
#   docker compose -f docker-compose-frontend.yml logs -f webapp
#   docker compose -f docker-compose-frontend.yml down
#
# Reference: README.md "Quick Start — Native Deployment" (Phase A vs Phase B)
# =============================================================================

services:

  # ── Frontend webapp (talks to native backend via host.docker.internal) ───
  webapp:
    build:
      context: app/Webapp
      dockerfile: Dockerfile
    container_name: prostatecancer-webapp-native
    env_file:
      - app/Webapp/.env       # NEXT_PUBLIC_API_URL=http://host.docker.internal:18000
    environment:
      NODE_ENV: production
      # Server-only env vars (host.docker.internal lets the container reach
      # the native uvicorn backend on the Mac/Linux host).
      BACKEND_URL: http://host.docker.internal:18000
      # API_KEY comes from env_file (app/Webapp/.env) — NOT a ${API_KEY} shell
      # interpolation, which injected an EMPTY key whenever `docker compose up`
      # was run without first sourcing app/Backend/.env (blank dashboard).
    extra_hosts:
      # Linux: docker doesn't auto-resolve host.docker.internal — declare it.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3001:3000"        # webapp directly on 3001 (no nginx in native mode)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
