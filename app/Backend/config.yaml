# Pipeline Configuration
# All configurable parameters — no hardcoded values in code.

pipeline:
  top_n: 10                    # Top-N sentences per domain
  context_window: 3            # ±N surrounding sentences for context
  batch_size: 50               # NLP API batch size (max per request)
  speaker_col: "speaker"       # Column name for speaker
  text_col: "text"             # Column name for text

paths:
  transcript_dir: "/app/data/transcripts"  # Input transcript directory
  output_dir: "/app/data/output"           # Output folder (per-file subfolders)
  intermediate_dir: "/app/data/intermediate"  # Debug intermediate results

worker:
  enabled: false               # true = continuous monitoring mode
  scan_interval_seconds: 3600  # Sleep between scans (1 hour)

scoring:
  scorer_url: "http://consultation-scorer:8001"
  scorer_timeout: 30
  rewriter_url: "http://patient-summary-rewriter:8002"
  rewriter_timeout: 30
  summary_top_k: 3             # Top sentences used for patient summary

nlp:
  api_url: "http://nlp-classifiers:8000"
  timeout: 30
  retries: 3
  cache_ttl: 3600
