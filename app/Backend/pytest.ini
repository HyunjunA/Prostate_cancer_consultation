[pytest]
asyncio_mode = auto
# One event loop for the whole run. The database engine is session-scoped, and
# asyncpg connections are bound to the loop that created them — a loop per test
# makes the pooled connection fail with "another operation is in progress".
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    e2e: end-to-end tests requiring Docker
    integration: integration tests
    slow: slow-running tests
addopts = -v --tb=short
