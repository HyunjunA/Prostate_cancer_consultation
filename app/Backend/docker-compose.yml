version: "3.8"

services:
  postgres:
    image: postgres:13
    container_name: prostatecancer-postgres
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h localhost",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: prostatecancer-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    volumes:
      - redis_data:/data
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nlp-classifiers:
    image: r01-nlp-classifiers:latest
    networks: [prostatecancer-network]
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "Rscript -e 'q(status=!grepl(\"online\",readLines(url(\"http://localhost:8000/ping\"))))'"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 90s

  backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prostatecancer-backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_TIMEOUT: 30
      DATABASE_POOL_RECYCLE: 1800
      DATABASE_POOL_USE_LIFO: "true"
      REDIS_URL: redis://redis:6379/0
      NLP_API_URL: http://nlp-classifiers:8000
      AUTH_MODE: ${AUTH_MODE:-api_key}
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001","http://localhost"]'
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      # - ./Processed_Data_DB.csv:/app/Processed_Data_DB.csv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-classifiers:
        condition: service_healthy
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
  webapp:
    build:
      context: ../Webapp
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${API_KEY}
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-}
        NEXT_PUBLIC_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    container_name: prostatecancer-webapp
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-}
      NEXT_PUBLIC_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    # ports:
    #   - "3000:3000"   # optional: direct debug access

  nginx:
    image: nginx:alpine
    container_name: prostatecancer-nginx
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ../Webapp/nginx_setup/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      webapp:
        condition: service_started
    networks: [prostatecancer-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  prostatecancer-network:
    driver: bridge
