# TLS front door for the dashboard (service "webapp-tls" in
# docker-compose-frontend.yml).
#
# Why this exists: the Re-write Practice voice input calls getUserMedia, and
# browsers expose that API only in a secure context. On http://<ip>:3001 the
# microphone therefore cannot open at all — no application code can change
# that. Serving the identical app over https:// is what makes it available,
# and unlike the chrome://flags workaround it needs nothing from the tester's
# browser and works in Chrome, Edge, Safari and Firefox alike.
#
# The certificate is self-signed (a private 10.x address cannot get a public
# CA certificate), so the first visit shows a warning to click through. After
# that the origin is a full secure context.
#
# Plain :3001 is left exactly as it was — this is an additional door, not a
# replacement.

# Only send "Connection: upgrade" for requests that actually ask for it —
# hardcoding it breaks keep-alive for ordinary page loads.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 10.177.43.229:3000 ssl;
  http2 on;
  server_name _;

  # Leaf + issuing CA in one file. Serving the leaf alone leaves a browser
  # that has imported the CA unable to build a chain to it.
  ssl_certificate     /etc/nginx/tls/webapp-fullchain.crt;
  ssl_certificate_key /etc/nginx/tls/webapp.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1h;

  server_tokens off;
  client_max_body_size 16m;

  # Plain http addressed to this TLS port (http://10.226.8.205:3443/…) is
  # reported by nginx as its own status 497. Send it to the same host, port and
  # query string over https rather than showing the raw protocol error.
  #
  # 302 and no-store, deliberately, not 301: a permanent redirect is cached by
  # the browser indefinitely, so a URL that was redirected once keeps
  # redirecting long after the server stops sending it — which is exactly what
  # happened on 2026-09-10 when this briefly sat on port 3001. A redirect that
  # might ever be withdrawn must not be cacheable.
  error_page 497 = @upgrade;

  location @upgrade {
    add_header Cache-Control "no-store" always;
    return 302 https://$http_host$request_uri;
  }

  # The speech model weights are fetched by the worker from the Hugging Face
  # CDN and cached by the browser; nothing here proxies them.
  location / {
    # "webapp" is the compose service name — same project network as this one.
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }

  location /nginx-health {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
